[workspace]
members = [
    "src/network",     # High-frequency proxies
    "src/security",    # Netmapper and recon tools
    "src/bpf",         # eBPF/XDP loaders
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1.35", features = ["full"] }
aya = "0.12" # eBPF library for Rust
reqwest = { version = "0.11", features = ["json"] }
