version: '3.8'

services:
  kellar-ui:
    build: ./kellar-ui
    ports:
      - "3000:3000"
    depends_on:
      - aquarius
    networks:
      - kellar-net

  aquarius:
    build: ./aquarius
    ports:
      - "8000:8000"
    environment:
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      - kellar-net

  s3lf-c0n8ci0us:
    build: ./s3lf-c0n8ci0us
    networks:
      - kellar-net

  malware-sandbox:
    build: ./malware-sandbox
    # Isolated network or specific firewall rules would go here in production
    networks:
      - sandbox-net

networks:
  kellar-net:
    driver: bridge
  sandbox-net:
    driver: bridge # Kept separate to prevent sandbox breakouts from reaching core services
